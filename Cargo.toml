[package]
name = "dopepad"
version = "0.2.0"
edition = "2021"
description = "Fast minimalist GUI notepad with inline DopeSyntax preview"
license = "MIT"
authors = ["phpont"]
repository = "https://github.com/phpont/DopePad"
readme = "README.md"
keywords = ["notes", "gtk", "markdown", "editor"]
categories = ["gui", "text-editors"]

[[bin]]
name = "dopepad"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
pango = "0.20"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
